services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: handscript
      POSTGRES_PASSWORD: handscript
      POSTGRES_DB: handscript
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handscript"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    # minio/minio was removed from Docker Hub. Silo is a drop-in S3 server
    # with the same MINIO_* settings and server command.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: handscript
      MINIO_ROOT_PASSWORD: handscriptsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://handscript:handscript@postgres:5432/handscript
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: handscript
      S3_ACCESS_KEY: handscript
      S3_SECRET_KEY: handscriptsecret
      EMBEDDED_WORKER: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      HANDFONTED_URL: http://handfonted:8010
    ports:
      - "8000:8000"
    volumes:
      - studiofiles:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      handfonted:
        condition: service_healthy

  worker:
    build: ./api
    restart: unless-stopped
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://handscript:handscript@postgres:5432/handscript
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: handscript
      S3_ACCESS_KEY: handscript
      S3_SECRET_KEY: handscriptsecret
      EMBEDDED_WORKER: "false"
      HANDFONTED_URL: http://handfonted:8010
    volumes:
      - studiofiles:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      handfonted:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  handfonted:
    build: ./services/handfonted
    restart: unless-stopped
    environment:
      HANDFONTED_ROOT: /opt/handfonted/HandFonted
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s

volumes:
  pgdata:
  minio:
  studiofiles:
